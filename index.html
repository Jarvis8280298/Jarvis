<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>JARVIS 4.4</title><style>
:root{--c:#63ecff;--a:#ffb65f;--g:#6ef2bd;--t:#e9fdff;--m:#79a6b3;--l:#173c49}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02070b;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 7%,#12344255,transparent 34%),#02070b}.app{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 4px}.brand{font-size:28px;font-weight:900;letter-spacing:8px}.pill{border:1px solid #216c5f;border-radius:99px;padding:7px 10px;color:var(--g);font-size:11px}.hud,.panel{border:1px solid var(--l);background:#061018ee;border-radius:26px;margin-bottom:14px}.hud{padding:20px;overflow:hidden}.core{width:260px;height:260px;margin:0 auto 12px;position:relative}.ring{position:absolute;border-radius:50%;border:1px solid #63ecff88}.r1{inset:0;border-style:dashed;animation:s 12s linear infinite}.r2{inset:24px;border-width:2px;animation:r 9s linear infinite}.r3{inset:57px;border:3px solid var(--c);box-shadow:0 0 28px #63ecff77}.r4{inset:90px}.arc{position:absolute;inset:8px;border-radius:50%;border-top:5px solid var(--a);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:5px solid transparent;animation:s 7s linear infinite}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.center b{font-size:28px;letter-spacing:8px}.center small{display:block;color:var(--m);letter-spacing:2px;margin-top:7px}.busy .r1,.busy .r2,.busy .arc{animation-duration:1s}.busy .r3{box-shadow:0 0 65px #63ecff}.busy .center small{color:var(--a)}@keyframes s{to{transform:rotate(360deg)}}@keyframes r{to{transform:rotate(-360deg)}}.stats,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border-top:1px solid #17404c;padding:10px 2px;color:var(--m);font-size:10px;letter-spacing:1px}.stat b{display:block;color:var(--t);font-size:12px;margin-top:4px}button{border:1px solid #285c69;background:#0a2632;color:var(--t);border-radius:14px;padding:13px 9px;font-weight:800;font-size:14px}.primary{background:#087f95}.amber{border-color:#8b5d2d;color:#ffd4a0}.panel{padding:16px}.panel h3{margin:0 0 12px}.chat{height:270px;overflow:auto;background:#02070a;border-radius:14px;padding:10px}.msg{padding:11px;margin:7px 0;border-radius:12px}.j{background:#0a2834;border-left:2px solid var(--c)}.u{background:#12251e;border-right:2px solid var(--g);text-align:right}.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1;min-width:0;background:#041016;border:1px solid #285565;color:white;border-radius:13px;padding:13px}.note,.muted{font-size:11px;color:var(--m);margin-top:7px}.item{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #14313a}.grow{flex:1}.done{text-decoration:line-through;color:#607d86}
</style></head><body><div class="app"><div class="top"><div class="brand">JARVIS 4.4</div><div class="pill">● ONLINE</div></div>
<section class="hud" id="hud"><div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="arc"></div><div class="ring r3"></div><div class="ring r4"></div><div class="center"><div><b>JARVIS</b><small id="mode">SMART ROUTER ONLINE</small></div></div></div><div class="stats"><div class="stat">SYSTEM STATUS<b id="status">All systems nominal.</b></div><div class="stat">VOICE CHANNEL<b>READY</b></div><div class="stat">LOCAL MEMORY<b id="mc">0 ENTRIES</b></div><div class="stat">TASK QUEUE<b id="tc">0 ACTIVE</b></div></div><div class="actions"><button class="primary" onclick="talk()">🎙️ TALK</button><button onclick="speak(last||'At your service.')">🔊 JARVIS VOICE</button><button onclick="askAI()">🧠 ASK AI</button><button class="amber" onclick="webSearch()">🌐 WEB SEARCH</button></div></section>
<section class="panel"><h3>COMMAND CENTER</h3><div class="chat" id="chat"></div><div class="row"><input id="cmd" placeholder="Enter command..."><button class="primary" onclick="send()">SEND</button></div><div class="note">Tap TALK, then use the microphone on the iPhone keyboard for Apple Dictation.</div></section>
<section class="panel"><h3>MISSION TASKS</h3><div id="tasks"></div><div class="row"><input id="task" placeholder="New task"><button onclick="addTask()">ADD</button></div></section>
<section class="panel"><h3>MEMORY BANK</h3><div id="notes"></div><div class="row"><input id="note" placeholder="Remember this..."><button onclick="addNote()">SAVE</button></div></section></div>
<script>
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let d=JSON.parse(localStorage.getItem('jarvis44')||localStorage.getItem('jarvis43')||'{"tasks":[],"notes":[]}'),last='';
function save(){localStorage.setItem('jarvis44',JSON.stringify(d));render()}function render(){$('tasks').innerHTML=d.tasks.length?d.tasks.map((t,i)=>`<div class=item><input type=checkbox ${t.done?'checked':''} onchange="tog(${i})"><span class="grow ${t.done?'done':''}">${esc(t.text)}</span><button onclick="dt(${i})">×</button></div>`).join(''):'<div class=muted>No active tasks.</div>';$('notes').innerHTML=d.notes.length?d.notes.map((n,i)=>`<div class=item><span class=grow>${esc(n)}</span><button onclick="dn(${i})">×</button></div>`).join(''):'<div class=muted>Memory bank empty.</div>';$('mc').textContent=d.notes.length+' ENTRIES';$('tc').textContent=d.tasks.filter(t=>!t.done).length+' ACTIVE'}
function msg(w,t,c){$('chat').innerHTML+=`<div class="msg ${c}"><b>${w}:</b> ${esc(t)}</div>`;$('chat').scrollTop=$('chat').scrollHeight}function busy(on,label='PROCESSING COMMAND'){$('hud').classList.toggle('busy',on);$('mode').textContent=on?label:'SMART ROUTER ONLINE'}
function voice(){let v=speechSynthesis.getVoices();return v.find(x=>/Daniel/i.test(x.name))||v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||v[0]}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),v=voice();if(v)u.voice=v;u.lang=v?.lang||'en-GB';u.rate=.88;u.pitch=.82;speechSynthesis.speak(u)}function reply(t){last=t;msg('JARVIS',t,'j');$('status').textContent=t;speak(t)}
function talk(){$('cmd').focus();$('status').textContent='Apple Dictation ready.'}
function exactTime(l){return /^(what('?s| is)? the time|what time is it|tell me the time|current time|time)$/.test(l)}function exactDate(l){return /^(what('?s| is)? the date|what day is it|today'?s date|current date|date)$/.test(l)}
function live(l){return ['weather','forecast','temperature','rain','snow','concert','event','showtime','show time','ticket','news','latest','today','tonight','tomorrow','weekend','sports','score','game','standings','schedule','near me','nearby','open now','hours','restaurant','store','movie','price','cost','stock','market','traffic','flight','delay'].some(k=>l.includes(k))}
function local(x){let l=x.toLowerCase().trim();if(exactTime(l)){reply('It is '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));return 1}if(exactDate(l)){reply('Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}));return 1}if(l.startsWith('add task ')){d.tasks.push({text:x.slice(9),done:false});save();reply('Task added.');return 1}if(l.startsWith('remember ')){d.notes.unshift(x.slice(9));save();reply('Stored in memory.');return 1}if(/^(list|show) (my )?tasks$/.test(l)){reply(d.tasks.length?d.tasks.map((t,i)=>`${i+1}. ${t.text}${t.done?' completed':''}`).join('; '):'No tasks are currently stored.');return 1}return 0}
function send(){let x=$('cmd').value.trim();if(!x)return;$('cmd').value='';msg('YOU',x,'u');busy(1);setTimeout(()=>{if(local(x)){busy(0);return}if(live(x.toLowerCase())){busy(0);search(x);return}busy(0);ai(x)},300)}
function search(q){reply('That needs current information. Opening a live web search.');setTimeout(()=>location.href='https://www.google.com/search?q='+encodeURIComponent(q),300)}
function ai(q){let c=`You are JARVIS, my personal assistant. Be concise, practical and helpful.\nSaved memories: ${JSON.stringify(d.notes)}\nTasks: ${JSON.stringify(d.tasks)}\nQuestion: ${q}`;try{navigator.clipboard.writeText(c)}catch(e){}reply('Opening ChatGPT for analysis. Paste the command if needed.');setTimeout(()=>location.href='https://chatgpt.com/',300)}
function askAI(){let q=$('cmd').value.trim()||prompt('What do you want to ask AI?')||'';if(q){busy(1,'AI ANALYSIS');setTimeout(()=>{busy(0);ai(q)},250)}}function webSearch(){let q=prompt('Search the web for:');if(q){busy(1,'LIVE WEB SEARCH');setTimeout(()=>{busy(0);search(q)},250)}}
function addTask(){let x=$('task').value.trim();if(!x)return;d.tasks.push({text:x,done:false});$('task').value='';save();reply('Task added.')}function tog(i){d.tasks[i].done=!d.tasks[i].done;save()}function dt(i){d.tasks.splice(i,1);save()}function addNote(){let x=$('note').value.trim();if(!x)return;d.notes.unshift(x);$('note').value='';save();reply('Stored in memory.')}function dn(i){d.notes.splice(i,1);save()}
$('cmd').onkeydown=e=>{if(e.key==='Enter')send()};msg('JARVIS','JARVIS 4.4 online. Smart command routing initialized.','j');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
