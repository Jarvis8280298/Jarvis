<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="manifest.webmanifest">
<title>JARVIS 3.0</title>
<style>
:root{--bg:#050a0f;--panel:#0b151d;--line:#173946;--text:#e7fbff;--muted:#82a8b3;--a:#55e7ff;--g:#66f3b0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(circle at 50% -10%,#123342 0,#050a0f 48%)}
.app{max-width:760px;margin:auto;padding:14px 14px 24px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 18px}
.brand{font-size:26px;font-weight:900;letter-spacing:5px}.pill{font-size:11px;color:var(--g);border:1px solid #245d50;border-radius:99px;padding:7px 9px}
.card{background:#09141de8;border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:14px;box-shadow:0 15px 45px #0007}.hero{text-align:center}
.orb{height:190px;width:190px;margin:14px auto;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;box-shadow:0 0 22px #55e7ff55,inset 0 0 35px #55e7ff33;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 40px #55e7ff88,inset 0 0 50px #55e7ff44}}
.orb b{letter-spacing:4px}.sub{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{appearance:none;border:1px solid #2c5d6c;background:#0c2632;color:var(--text);border-radius:14px;padding:12px;font-weight:800;font-size:14px}button:active{transform:scale(.98)}.primary{background:#08758a}
.chat{height:260px;overflow:auto;background:#040a0e;border-radius:14px;padding:10px}.msg{padding:10px;margin:7px 0;border-radius:12px;line-height:1.4}.j{background:#0c2935}.u{background:#153226;text-align:right}
.row{display:flex;gap:8px;margin-top:9px}.row input{min-width:0;flex:1;background:#061017;border:1px solid #295362;border-radius:13px;color:white;padding:12px;font-size:15px}
.item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #14313a}.item:last-child{border:0}.grow{flex:1}.muted{color:var(--muted);font-size:12px}
.list{max-height:160px;overflow:auto}.done{text-decoration:line-through;color:#63828b}.danger{color:#ff9d9d}
footer{text-align:center;color:#56737c;font-size:10px;padding:5px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">JARVIS <small>3.0</small></div><div class="pill">● ONLINE</div></header>
<section class="card hero">
<div class="orb"><b>JARVIS</b></div><div class="sub" id="status">Ready for command.</div>
<div class="grid" style="margin-top:13px"><button class="primary" onclick="listen()">🎙️ Talk</button><button onclick="speak('JARVIS is online.')">🔊 Speak</button><button onclick="webSearch()">🌐 Search</button><button onclick="installHint()">📲 Install</button></div>
</section>
<section class="card"><h3>Conversation</h3><div class="chat" id="chat"></div><div class="row"><input id="cmd" placeholder="Try “add task clean room”"><button class="primary" onclick="send()">Send</button></div></section>
<section class="card"><h3>Tasks</h3><div class="list" id="tasks"></div><div class="row"><input id="task" placeholder="New task"><button onclick="addTask()">Add</button></div></section>
<section class="card"><h3>Memory</h3><div class="list" id="notes"></div><div class="row"><input id="note" placeholder="Remember this..."><button onclick="addNote()">Save</button></div></section>
<section class="card"><h3>System</h3><div class="item">🕒 <span class="grow">Time</span><b id="time"></b></div><div class="item">📅 <span class="grow">Date</span><b id="date"></b></div><div class="item">📡 <span class="grow">Connection</span><b id="conn"></b></div><div class="item">🛡️ <span class="grow">Ads inside JARVIS</span><b style="color:var(--g)">NONE</b></div><button class="danger" onclick="resetAll()">Reset local data</button></section>
<footer>JARVIS 3.0 PWA · Data stays in this browser until you clear it.</footer>
</div>
<script>
const $=x=>document.getElementById(x);
let d=JSON.parse(localStorage.getItem('jarvis3')||'{"tasks":[],"notes":[]}');
function save(){localStorage.setItem('jarvis3',JSON.stringify(d));render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 $('tasks').innerHTML=d.tasks.length?d.tasks.map((t,i)=>`<div class="item"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><span class="grow ${t.done?'done':''}">${esc(t.text)}</span><button onclick="delTask(${i})">×</button></div>`).join(''):'<div class="muted">No tasks.</div>';
 $('notes').innerHTML=d.notes.length?d.notes.map((n,i)=>`<div class="item"><span class="grow">${esc(n)}</span><button onclick="delNote(${i})">×</button></div>`).join(''):'<div class="muted">No memories.</div>';
}
function msg(w,t,c){$('chat').innerHTML+=`<div class="msg ${c}"><b>${w}:</b> ${esc(t)}</div>`;$('chat').scrollTop=$('chat').scrollHeight}
function reply(t){msg('JARVIS',t,'j');$('status').textContent=t;speak(t)}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function addTask(){let x=$('task').value.trim();if(!x)return;d.tasks.push({text:x,done:false});$('task').value='';save();reply('Task added.')}
function toggle(i){d.tasks[i].done=!d.tasks[i].done;save()}
function delTask(i){d.tasks.splice(i,1);save()}
function addNote(){let x=$('note').value.trim();if(!x)return;d.notes.unshift(x);$('note').value='';save();reply('Saved to local memory.')}
function delNote(i){d.notes.splice(i,1);save()}
function send(){let x=$('cmd').value.trim();if(!x)return;$('cmd').value='';msg('YOU',x,'u');handle(x)}
function handle(x){let l=x.toLowerCase();
if(l.includes('help'))return reply('I can manage tasks, local memory, time, date, voice, and web search.');
if(l.includes('time'))return reply('It is '+new Date().toLocaleTimeString());
if(l.includes('date'))return reply('Today is '+new Date().toLocaleDateString());
if(l.startsWith('add task ')){d.tasks.push({text:x.slice(9),done:false});save();return reply('Task added.')}
if(l.startsWith('remember ')){d.notes.unshift(x.slice(9));save();return reply('I remembered that locally.')}
if(l.includes('list tasks'))return reply(d.tasks.length?d.tasks.map((t,i)=>`${i+1}. ${t.text}${t.done?' done':''}`).join('; '):'No tasks.');
if(l.includes('search'))return webSearch();
return reply('I received that. My full AI brain can be connected to this PWA through a secure backend.');
}
function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return reply('Voice recognition is not available in this browser.');let r=new SR();r.lang='en-US';$('status').textContent='Listening...';r.onresult=e=>{$('cmd').value=e.results[0][0].transcript;send()};r.onerror=()=>reply('I could not hear that.');r.start()}
function webSearch(){let q=prompt('Search for:');if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q)}
function installHint(){reply('In Safari, use Share, then Add to Home Screen. The manifest and iPhone web-app settings are already included.')}
function resetAll(){if(confirm('Delete JARVIS local tasks and memory?')){d={tasks:[],notes:[]};save();reply('Local data reset.')}}
$('cmd').onkeydown=e=>{if(e.key==='Enter')send()};
setInterval(()=>{$('time').textContent=new Date().toLocaleTimeString();$('date').textContent=new Date().toLocaleDateString();$('conn').textContent=navigator.onLine?'Online':'Offline'},1000);
msg('JARVIS','Welcome. JARVIS 3.0 is online.','j');render();
if('serviceWorker'in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
